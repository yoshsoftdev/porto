services:
  - type: web
    name: porto-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: porto-db
          property: connectionString

databases:
  - name: porto-db
    plan: free
    databaseName: porto
    user: porto
